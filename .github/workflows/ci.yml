name: CI

on:
  pull_request:
  push:
    branches:
      - feat/US-010-m2-application-foundation

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (typecheck, lint, unit, build, security/static)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck

        id: typecheck
        run: npm run typecheck

      - name: Lint

        id: lint
        run: npm run lint

      - name: Unit tests

        id: unit
        run: npm test

      - name: Build

        id: build
        run: npm run build

      - name: Security/static check
        id: security
        run: |
          set -euo pipefail
          # Scan tracked files (exclude node_modules/dist) for credential-bearing
          # patterns. Intentional: this is a lightweight gate, not a full secret
          # scanner. We match credential *forms* (keys/URLs/secrets with values),
          # not bare mentions of a service name in docs.
          if rg -i -n --hidden -g '!node_modules/**' -g '!dist/**' -g '!.git/**' \
              -e 'SUPABASE_(URL|ANON_KEY|SERVICE_ROLE_KEY|KEY|SECRET)\s*[:=]' \
              -e 'sk-[A-Za-z0-9]{20,}' \
              -e 'api[_-]?key\s*[:=]\s*["'"'"'][^"'"'"']{8,}' \
              -e 'password\s*[:=]\s*["'"'"'][^"'"'"']{8,}' \
              -e 'secret\s*[:=]\s*["'"'"'][^"'"'"']{8,}' \
              -e 'token\s*[:=]\s*["'"'"'][^"'"'"']{8,}' \
              .; then
            echo "::error::Potential secret/credential pattern found in tracked files. Review and remove before merging."
            exit 1
          fi
          echo "No obvious secret/credential patterns found."

      - name: Static check
        id: neutral
        run: |
          set -euo pipefail
          file="src/content/portfolio.public.json"
          test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          grep -q '"profile": null' "$file" || { echo "::error::$file must contain \"profile\": null"; exit 1; }
          grep -q '"capabilities": \[\]' "$file" || { echo "::error::$file must contain \"capabilities\": []"; exit 1; }
          echo "portfolio.public.json is neutral (no invented content)."

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "CI validation summary"
            echo "====================="
            echo "typecheck: ${{ steps.typecheck.outcome }}"
            echo "lint: ${{ steps.lint.outcome }}"
            echo "unit tests: ${{ steps.unit.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "security/static scan: ${{ steps.security.outcome }}"
            echo "portfolio.public.json neutral-absence check: ${{ steps.neutral.outcome }}"
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
          } > validate-summary.txt

      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-summary
          path: validate-summary.txt
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright + evidence capture)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build

        id: build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --workers=2 --grep-invert "visual evidence capture|visual evidence|Zavit visual evidence|Architecture Table visual evidence|M7 visual fidelity evidence"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Capture visual evidence
        if: always()
        run: |
          EVIDENCE_DIR=evidence/ci npx playwright test \
            capture-evidence.spec.ts m4-evidence.spec.ts m5-evidence.spec.ts m7-evidence.spec.ts \
            --workers=2

      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-screenshots
          path: evidence/
          if-no-files-found: ignore
